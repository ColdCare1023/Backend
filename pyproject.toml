[tool.ruff]
# El frontend ya tenía ESLint + tsc; el backend, que es el componente más
# grande, no tenía ningún análisis estático. Ruff cubre lint e imports.
target-version = "py312"
line-length = 110
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes: nombres sin definir, imports muertos
    "I",    # orden de imports
    "B",    # bugbear: fallos sutiles reales
    "C4",   # comprehensions
    "UP",   # sintaxis moderna disponible en 3.12
    "RUF",  # reglas propias de ruff
]
ignore = [
    # FastAPI declara las dependencias como valores por defecto
    # (`Depends(...)`, `Query(...)`): es su API, no un descuido.
    "B008",
    # Líneas largas: el proyecto usa comentarios explicativos extensos a
    # propósito. `E501` las cortaría a costa de la explicación.
    "E501",
    # `datetime.timezone.utc` → `datetime.UTC`. Puro estilo: el alias no aporta
    # claridad y reescribiría 71 puntos del código sin cambiar comportamiento.
    # `timezone.utc` no está obsoleto.
    "UP017",
    # Guiones largos («2–8 °C», «Lima – Perú») son tipografía correcta en los
    # textos que ve el usuario, no caracteres confundibles por error.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Las pruebas acceden a propiedades perezosas dentro de `pytest.raises` para
# provocar la validación: es la expresión la que debe evaluarse, no su valor.
"tests/**" = [
    "B018",
    # Los dobles de modelo declaran listas de clases/features como atributos:
    # son datos fijos de la prueba, no estado compartido mutable.
    "RUF012",
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "scripts"]
