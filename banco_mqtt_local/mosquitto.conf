# Broker local del banco de pruebas — mismo modelo de seguridad que EMQX:
# solo TLS en 8883, sin anónimos, usuario = device_id, ACL por tópico.
# Ejecutar desde esta carpeta:  "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v
allow_anonymous false
password_file pwfile
acl_file aclfile

listener 8883
cafile certs/ca.crt
certfile certs/servidor.crt
keyfile certs/servidor.key
tls_version tlsv1.2
