%% ACL de EMQX (modelo de la HU-10): mínimo privilegio por dispositivo.
%% Usuario MQTT = device_id. Un nodo solo publica en SUS tópicos y solo
%% escucha SU acuse; el backend lee todo y solo publica acuses.
%% Todo lo que no coincida se deniega (authorization.no_match = deny).

{allow, {username, "backend_service"}, subscribe, ["farmacias/+/lecturas", "farmacias/+/eventos"]}.
{allow, {username, "backend_service"}, publish,   ["farmacias/+/ack", "farmacias/+/ota"]}.

{allow, all, publish,   ["farmacias/${username}/lecturas", "farmacias/${username}/eventos"]}.
%% IOT-004: el nodo escucha SUS órdenes OTA; solo el backend puede publicarlas.
{allow, all, subscribe, ["farmacias/${username}/ack", "farmacias/${username}/ota"]}.

{deny, all}.
