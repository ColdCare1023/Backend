# Entorno local de ColdCare: PostgreSQL + EMQX (TLS 8883, sin 1883) + backend.
#   ./scripts/init.sh <IP_LAN_de_la_PC>     (una vez: certificados + secretos)
#   docker compose up -d                    (postgres + emqx)
#   docker compose --profile backend up -d --build   (además, el backend)
name: thermotrace

services:
  postgres:
    # BE-022: imágenes fijadas por digest (índice multi-arquitectura).
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  emqx:
    image: emqx/emqx:5.8.6@sha256:a1e3d10fa1dcc8c94325b815a93b5b5974253a97cb36470b44e47d5d3ef9cd13
    restart: unless-stopped
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      # HU-14: sin listener 1883 (ni WebSocket). Solo TLS en 8883.
      EMQX_LISTENERS__TCP__DEFAULT__ENABLE: "false"
      EMQX_LISTENERS__WS__DEFAULT__ENABLE: "false"
      EMQX_LISTENERS__WSS__DEFAULT__ENABLE: "false"
      EMQX_LISTENERS__SSL__DEFAULT__BIND: "0.0.0.0:8883"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: /opt/emqx/certs/ca.crt
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/certs/servidor.crt
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/certs/servidor.key
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: verify_none
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERSIONS: '["tlsv1.3","tlsv1.2"]'
      # HU-10: autenticación usuario/clave (usuario = device_id), sin anónimos.
      # Cadena de autenticación (BE-002), en orden:
      #   1. Base interna de EMQX: SOLO la cuenta de servicio del backend.
      #   2. Webhook HTTP del backend para los dispositivos: la credencial vive
      #      en la tabla `devices`, así que rotar o revocar desde la API tiene
      #      efecto real en el broker. Un usuario que no está en (1) pasa a (2).
      # `$$` evita que docker compose interprete los placeholders de EMQX.
      EMQX_AUTHENTICATION__1: '{mechanism="password_based",backend="built_in_database",user_id_type="username",password_hash_algorithm={name="sha256",salt_position="suffix"},bootstrap_file="/opt/emqx/etc/bootstrap_users.csv",bootstrap_type="plain",enable=true}'
      EMQX_AUTHENTICATION__2: '{mechanism="password_based",backend="http",method="post",url="http://backend:8000/api/dispositivos/autenticar",body={device_id="$${username}",token="$${password}"},headers={"content-type"="application/json","x-broker-auth"="${BROKER_WEBHOOK_SECRET}"},enable=true}'
      # API key para que el backend expulse la sesión de un dispositivo al
      # revocar o rotar su credencial (DELETE /api/v5/clients/{clientid}).
      EMQX_API_KEY__BOOTSTRAP_FILE: /opt/emqx/etc/api_keys.txt
      # Autorización: lo que no esté permitido en acl.conf se deniega.
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: ignore
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      EMQX_LOG__CONSOLE__LEVEL: info
    ports:
      - "8883:8883"
      - "127.0.0.1:18083:18083"   # dashboard solo desde esta PC
    volumes:
      - ./certs/ca.crt:/opt/emqx/certs/ca.crt:ro
      - ./certs/servidor.crt:/opt/emqx/certs/servidor.crt:ro
      - ./certs/servidor.key:/opt/emqx/certs/servidor.key:ro
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./emqx/bootstrap_users.csv:/opt/emqx/etc/bootstrap_users.csv:ro
      - ./emqx/api_keys.txt:/opt/emqx/etc/api_keys.txt:ro
      - emqxdata:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # BE-022: las migraciones corren una vez, antes del backend, y no en cada
  # arranque de cada réplica.
  migraciones:
    profiles: ["backend"]
    build:
      context: ..
      dockerfile: infra-local/backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      TRAZABILIDAD_HMAC_KEY: ${TRAZABILIDAD_HMAC_KEY}
    restart: "no"

  backend:
    profiles: ["backend"]
    build:
      context: ..
      dockerfile: infra-local/backend/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      emqx: { condition: service_healthy }
      migraciones: { condition: service_completed_successfully }
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      TRAZABILIDAD_HMAC_KEY: ${TRAZABILIDAD_HMAC_KEY}
      # Solo para probar la expiración de sesión (HU-39): JWT_EXPIRE_MIN=1 docker compose ...
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_EXPIRE_MIN:-60}
      MQTT_ENABLED: "true"
      MQTT_HOST: emqx
      MQTT_PORT: "8883"
      MQTT_USERNAME: backend_service
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      MQTT_TLS_ENABLED: "true"
      MQTT_CA_FILE: /certs/ca.crt
      # BE-002/BE-011: webhook de autenticación de dispositivos y API del broker.
      BROKER_WEBHOOK_SECRET: ${BROKER_WEBHOOK_SECRET}
      BROKER_API_URL: http://emqx:18083/api/v5
      BROKER_API_KEY: ${EMQX_API_KEY}
      BROKER_API_SECRET: ${EMQX_API_SECRET}
      # BE-022: estricto también en local; los nodos se dan de alta con
      # scripts/crear_dispositivo.py (que además emite su credencial MQTT).
      DEVICE_REGISTRY_ESTRICTO: ${DEVICE_REGISTRY_ESTRICTO:-true}
      ALLOWED_HOSTS: '["localhost","127.0.0.1","backend"]'
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro

volumes:
  pgdata:
  emqxdata:
