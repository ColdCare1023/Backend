# Correo de prueba (LAT-02, ALE-01): solo para el banco local, nunca en producción.
#   docker compose -f docker-compose.correo-prueba.yml up -d
# Backend con EMAIL_ENABLED=true SMTP_HOST=host.docker.internal SMTP_PORT=1025
# SMTP_SEGURIDAD=ninguna (la configuración rechaza esta opción con ENVIRONMENT=production).
# Bandeja web: http://localhost:8025   API: http://localhost:8025/api/v1/messages
# Va en un archivo aparte porque el compose principal exige imágenes fijadas por digest (BE-022).
name: thermotrace-correo

services:
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
