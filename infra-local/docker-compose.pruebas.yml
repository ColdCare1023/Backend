# Banco de pruebas de escritorio: el backend recibe las opciones de prueba y usa una base APARTE
# (coldcare_prueba), para no mezclar la evidencia con la del entorno de desarrollo.
#
#   docker compose -p coldcare-develop -f docker-compose.yml -f docker-compose.pruebas.yml --profile backend up -d --build
#
# IMPORTANTE: usa el MISMO nombre de proyecto del stack que ya corre (`-p coldcare-develop`). Sin `-p`
# Compose crea otro stack (`thermotrace`) con un Postgres vacío y choca en los puertos. Con `-p` comparte el
# Postgres actual y solo crea la base `coldcare_prueba`, sin tocar tus lecturas.
# La base nueva arranca SIN usuarios ni dispositivos: siémbralos antes de correr casos, apuntando a ella:
#   DATABASE_URL=postgresql+asyncpg://USER:PASS@localhost:5433/coldcare_prueba python -m scripts.seed_dev
#   (y scripts/crear_dispositivo.py para FARM-02-TEST, que además emite su credencial MQTT)
#   docker compose -f docker-compose.correo-prueba.yml up -d          # Mailpit (SMTP 1025, web 8025)
#
# Todas las variables tienen un valor por defecto «sin efecto»; se activan desde el entorno o `.env`:
#   IA_PREVENTIVO_MODO=sombra IA_PREVENTIVO_VERSION=... IA_PREVENTIVO_SHA256=...
#   IA_PRUEBA_RETARDO_S=2  IA_PRUEBA_EXCEPCION=true
#   MQTT_PRUEBA_FALLO_ANTES_COMMIT=excepcion_una_vez  (borrar la marca para repetir; ver abajo)
#   EMAIL_ENABLED=true SMTP_HOST=host.docker.internal SMTP_PORT=1025 SMTP_SEGURIDAD=ninguna
#   ALERTA_VENTANA_NORMALIZACION_MINUTOS=0  SIN_DATOS_PERIODO_SEGUNDOS=5
# Las opciones de falla se niegan a arrancar con ENVIRONMENT=production: aquí siempre es development.
name: thermotrace

x-opciones-prueba: &opciones-prueba
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_PRUEBAS:-coldcare_prueba}

services:
  # Crea la base de pruebas si no existe (la imagen de postgres solo crea POSTGRES_DB).
  bd-pruebas:
    profiles: ["backend"]
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tc
        "SELECT 1 FROM pg_database WHERE datname='${POSTGRES_DB_PRUEBAS:-coldcare_prueba}'" | grep -q 1 ||
        psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c
        "CREATE DATABASE ${POSTGRES_DB_PRUEBAS:-coldcare_prueba}"
    restart: "no"

  migraciones:
    depends_on:
      bd-pruebas: { condition: service_completed_successfully }
    environment:
      <<: *opciones-prueba

  backend:
    environment:
      <<: *opciones-prueba
      # IA: modo sombra del modelo preventivo y tope/inyección de fallos.
      IA_PREVENTIVO_MODO: ${IA_PREVENTIVO_MODO:-desactivado}
      IA_PREVENTIVO_VERSION: ${IA_PREVENTIVO_VERSION:-}
      IA_PREVENTIVO_SHA256: ${IA_PREVENTIVO_SHA256:-}
      IA_INFERENCIA_TIMEOUT_S: ${IA_INFERENCIA_TIMEOUT_S:-1.0}
      IA_PRUEBA_RETARDO_S: ${IA_PRUEBA_RETARDO_S:-0}
      IA_PRUEBA_EXCEPCION: ${IA_PRUEBA_EXCEPCION:-false}
      # MQT-01: fallo antes del COMMIT. La marca vive en un volumen para sobrevivir al reinicio.
      MQTT_PRUEBA_FALLO_ANTES_COMMIT: ${MQTT_PRUEBA_FALLO_ANTES_COMMIT:-}
      MQTT_PRUEBA_FALLO_MARCA: /pruebas/fallo_una_vez
      # Correo: Mailpit o el SMTP que falla (scripts/smtp_falla.py).
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-coldcare@prueba.local}
      EMAIL_DESTINO_RESPALDO: ${EMAIL_DESTINO_RESPALDO:-responsable@prueba.local}
      SMTP_HOST: ${SMTP_HOST:-host.docker.internal}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SEGURIDAD: ${SMTP_SEGURIDAD:-ninguna}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICACION_MAX_INTENTOS: ${NOTIFICACION_MAX_INTENTOS:-3}
      NOTIFICACION_COOLDOWN_MINUTOS: ${NOTIFICACION_COOLDOWN_MINUTOS:-15}
      ALERTA_VENTANA_NORMALIZACION_MINUTOS: ${ALERTA_VENTANA_NORMALIZACION_MINUTOS:-0}
      SIN_DATOS_N_INTERVALOS: ${SIN_DATOS_N_INTERVALOS:-3}
      SIN_DATOS_PERIODO_SEGUNDOS: ${SIN_DATOS_PERIODO_SEGUNDOS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pruebas:/pruebas

volumes:
  pruebas:
